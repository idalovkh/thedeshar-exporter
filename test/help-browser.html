<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка инструкции экспортера</title>
<style>body{max-width:1100px;margin:36px auto;padding:0 20px;font:17px/1.55 system-ui;color:#193342}h1{font-size:25px}pre{white-space:pre-wrap}li{margin:8px 0}iframe{display:block;width:100%;height:760px;border:1px solid #dde1e7;border-radius:12px}</style>
<h1>Проверка инструкции в браузере</h1>
<p id="status" role="status">Выполняются проверки…</p>
<ol id="results"></ol>
<pre id="failure"></pre>
<iframe id="preview" title="Экспортер с тестовой книгой"></iframe>
<script type="module">
import { runHelpChecks } from './help-checks.js';
const preview = document.querySelector('#preview');
try {
  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error('Preview did not load.')), 10000);
    preview.addEventListener('load', () => { clearTimeout(timeout); resolve(); }, { once: true });
    preview.src = './preview.html?tab=7&scenario=ready';
  });
  const passed = await runHelpChecks(preview.contentWindow);
  document.querySelector('#results').replaceChildren(...passed.map(text => { const li = document.createElement('li'); li.textContent = text; return li; }));
  document.querySelector('#status').textContent = `Успешно: ${passed.length} проверок инструкции.`;
} catch (error) {
  document.querySelector('#status').textContent = 'Ошибка проверки инструкции';
  document.querySelector('#failure').textContent = error.stack || error.message;
}
</script>
</html>
